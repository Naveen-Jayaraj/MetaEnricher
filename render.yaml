services:
  - type: web
    name: meta-enricher
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: API_KEY
        value: metaenricher_secret_key
      - key: AUTH_USERNAME
        value: admin
      - key: AUTH_PASSWORD
        value: metaenricher_secret
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
